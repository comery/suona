[package]
name = "suona"
version = "0.1.0"
description = "suona - a desktop pet that reports your local coding agents"
edition = "2021"
resolver = "3"
rust-version = "1.94"

[lib]
name = "suona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
anyhow = "1"

# Consult NSScreen for the real usable area: the Dock can be moved to either
# side, so "the sides are free" cannot be assumed.  macOS-only, like suona.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry"] }

[profile.dev]
incremental = true
